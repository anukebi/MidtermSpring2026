services:
  db:
    image: postgres:16-alpine
    container_name: midterm-db
    environment:
      POSTGRES_USER: midterm
      POSTGRES_PASSWORD: password
      POSTGRES_DB: midterm
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midterm"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  app:
    build: .
    container_name: midterm-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:15432/midterm
      SPRING_DATASOURCE_USERNAME: midterm
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
        
volumes:
  postgres-data:
